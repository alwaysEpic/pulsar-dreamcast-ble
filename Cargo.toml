[workspace]
members = [".", "maple-protocol"]

# Lint policy lives here, not in scripts/ci.sh, so that *every* invocation of
# `cargo clippy` — in CI or a local shell, from any directory — sees the identical
# rule set. When the rules lived only in the gate's argv, local runs were
# quietly weaker than CI and work was iterated against a lie.
[workspace.lints.rust]
# Adopt the edition-2024 behaviour early: an `unsafe fn` body is not implicitly
# an unsafe block. Without this, the 17 `unsafe fn` here silently license every
# unsafe operation in their bodies, which is exactly the "unsafe as a
# workaround" pattern the rest of this table exists to prevent.
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Unsafe must be justified, not merely possible. `undocumented_unsafe_blocks`
# is the mechanical form of that policy: no `unsafe {}` compiles without a
# `// SAFETY:` comment, and `multiple_unsafe_ops_per_block` stops one comment
# from covering a grab-bag of unrelated operations.
#
# `forbid`, not `deny`: a denied lint can be waved through with a local
# `#[expect(..)]`, which is the exact escape-hatch-as-workaround move this
# policy exists to stop. `forbid` cannot be overridden locally at all — an
# attempt is itself a hard error. Relaxing it means editing this table, which
# is visible in review; a one-line attribute buried in a function is not.
undocumented_unsafe_blocks = "forbid"
missing_safety_doc = "forbid"

# `deny`, not `forbid`, and the distinction is deliberate. The two lints above
# are about *justification*: there is never a good reason for an unsafe block
# with no argument for why it is sound, so they are absolute. This one is about
# *granularity*, and that is rebuttable — an MMIO configuration sequence is
# often one logical operation (set priority, then enable, in that order) sharing
# a single justification, and splitting it into a block per register write adds
# ceremony without adding safety. Deviating still costs an #[expect] carrying a
# written reason, so the argument is made in the diff rather than assumed.
multiple_unsafe_ops_per_block = "deny"

# Escape hatches must expire on their own. `#[expect]` warns once the
# suppression is no longer needed, so a fixed lint stops being papered over;
# `#[allow]` is silent forever and accumulates. Reasons are mandatory — the
# next reader gets the "why", not just the lint name.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# There is no unwinding on this target: a panic is a firmware-wide event that
# takes the controller offline mid-game.
#
# Also `forbid` — same reasoning as the unsafe block above. Tests remain
# ergonomic without any escape hatch, because clippy.toml's
# `allow-{unwrap,expect,panic}-in-tests` stops these lints from *firing* under
# `#[cfg(test)]` at all, rather than suppressing them with an attribute. So the
# exemption is scoped to tests by construction and cannot be borrowed by
# production code.
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

# `_name` is this codebase's marker for a binding that exists only for `log!`,
# which compiles to nothing without the `rtt` feature. The lint is unsatisfiable
# either way: drop the underscore and non-rtt builds report it unused, keep it
# and rtt builds report it used. The convention is the more useful signal.
used_underscore_binding = "allow"

# The Embassy executor here is single-threaded on one Cortex-M core: futures are
# polled from `executor-thread` and never move between threads, because there is
# no second thread to move them to. `Send` is unsatisfiable for any future
# holding a peripheral handle and would buy nothing if it were.
future_not_send = "allow"

# Deliberately NOT enabled — measured, not overlooked:
#
#   arithmetic_side_effects (144 sites) — every counter, timestamp delta and
#   period calculation trips it. The signal-to-noise never justifies it here.
#
#   indexing_slicing (83 sites) — the fix is `.get()`, which inserts a bounds
#   branch. In the RX sampling loop and the cycle-anchored TX path that is an
#   actively harmful change: those loops are cycle-counted, and
#   scripts/check_timing_invariants.sh exists precisely to catch codegen drift
#   there. Fixed-size arrays with const-asserted bounds are the safer idiom.

[package]
name = "pulsar-dreamcast-ble"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["alwaysEpic"]
description = "Bluetooth LE adapter for Dreamcast controllers — Rust on nRF52840"
repository = "https://github.com/alwaysEpic/pulsar-dreamcast-ble"
keywords = ["embedded", "dreamcast", "bluetooth", "nrf52", "gamepad"]
categories = ["embedded", "hardware-support", "no-std"]

[lints]
workspace = true

[dependencies]
maple-protocol = { path = "maple-protocol" }
# Core
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
heapless = "0.8.0"
static_cell = "2.1"

# Embassy async runtime (git versions for nrf-softdevice compatibility)
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["arch-cortex-m", "executor-thread", "embassy-time-driver"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy" }

# SoftDevice BLE stack (git for compatibility)
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", features = ["s140", "nrf52840", "ble-peripheral", "ble-gatt-server", "ble-sec", "critical-section-impl"] }
nrf-softdevice-s140 = { git = "https://github.com/embassy-rs/nrf-softdevice" }

# Flash storage
embedded-storage-async = "0.4.1"

# RTT debugging (optional — disable for production builds to save power/size)
rtt-target = { version = "0.3.1", features = ["cortex-m"], optional = true }

# Note: We use embassy-nrf's peripheral access for everything
# No legacy HAL to avoid duplicate interrupt vector table

[profile.release]
opt-level = "s"       # Optimize for size (often faster on Cortex-M due to flash prefetch)
lto = "fat"           # Full link-time optimization — critical for inlining timing code
codegen-units = 1     # Single codegen unit for maximum optimization
debug = 2             # Keep debug info for probe-rs

[features]
default = ["board-dk", "rtt"]
rtt = ["dep:rtt-target"]
board-dk = ["rtt"]
board-xiao = []
board-pulsarv1 = []

# Debug-only: stamp a 7-bit sequence counter into report byte 15 (bits 1-7,
# HID padding) so a host capture can detect reports dropped in transit. Not for
# normal play. Combine with a board feature:
#   cargo build --release --no-default-features --features board-dk,rtt,seq-counter
seq-counter = []
# HID side-channel: right-stick bytes 4-7 carry Maple get_condition failure
# counters ([4-5]=total LE u16, [6]=max consecutive streak, [7]=0x5A marker).
# Correlates poll-loop outages with host-side delivery gaps; mutually
# exclusive with gauge-debug / connparam-debug (same bytes).
#   cargo build --release --no-default-features --features board-pulsarv1,maple-fail-debug
maple-fail-debug = []

# Debug-only: smuggle the raw IP5306 `0x78` gauge byte out over BLE, in the
# right-stick report bytes (4-7) the Dreamcast never uses. The XIAO has no
# onboard debugger and there is no SWD probe for pulsarv1, so RTT cannot see
# this board — the HID report is the only channel that works untethered, on
# battery, which is exactly the condition the gauge has to be characterized in.
# Corrupts the right stick; never ship it. Read with `hid_capture.py --gauge`:
#   cargo build --release --no-default-features --features board-pulsarv1,gauge-debug
gauge-debug = []

# Debug-only: smuggle the BLE connection-parameter negotiation out over the same
# right-stick bytes (4-7). Answers the one question three rounds of parameter
# tuning could not (2026-07-27): the host runs us at 15 ms regardless of what we
# request, and we cannot tell whether that is the host refusing or our own
# request never being issued — `sd_ble_gap_conn_param_update` returns
# NRF_ERROR_BUSY (17) if another procedure is in flight, and it fires 500 ms
# after `request_security()` while bonding plausibly still is. This reports the
# raw return code alongside the *live negotiated* interval the SoftDevice
# actually holds. Mutually exclusive with gauge-debug (same bytes). Read with
# `hid_capture.py --connparam`:
#   cargo build --release --no-default-features --features board-pulsarv1,connparam-debug
connparam-debug = []

# HID side-channel: right-stick bytes 4-7 carry poll-loop period telemetry —
# rotating tagged payloads (0xB0|k in byte 7): window-mean/max poll period,
# get_condition span, sleep span, retry count, cadence overruns. Makes a bad
# binary-layout roll readable in ONE 30 s capture instead of a day of them
# (pulsarv1 has no RTT probe; the HID report is the only untethered channel).
# Mutually exclusive with gauge-debug / connparam-debug / maple-fail-debug
# (same bytes). Combinable with seq-counter (byte 15). Read with
# `hid_capture.py --pollperiod`:
#   cargo build --release --no-default-features --features board-pulsarv1,rtt,seq-counter,poll-period-debug
poll-period-debug = []

# Debug-only: DWT cycle-counter timing of the main poll loop, logged via RTT.
# Attributes the per-poll time (get_condition vs VMU write vs rest). Needs rtt.
#   cargo build --release --no-default-features --features board-dk,rtt,poll-timing
poll-timing = ["rtt"]

# The VMU LCD display is always compiled in (there is no `vmu` feature). The
# display write uses the hardware-timed PWM/EasyDMA TX (maple/pwm_tx.rs) —
# interrupt- and codegen-immune and proven not to perturb controller input — so
# there is nothing to gate. One artifact per board; an absent VMU simply leaves
# the fire-and-forget write unanswered.
