[package]
name = "maple-protocol"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["alwaysEpic"]
description = "Dreamcast Maple Bus protocol library"
repository = "https://github.com/alwaysEpic/pulsar-dreamcast-ble"

[lints]
workspace = true

[dependencies]
heapless = "0.8.0"

[features]
# Per-edge instrumentation on the block decoder — run lengths, double
# transitions, pause positions, the last edge, the skipped count. Read only by
# the read diagnostic; it costs cycles at every edge, so production builds
# leave it off.
decode-stats = []
